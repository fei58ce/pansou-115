# nginx.conf
user root;  # 定义 Nginx 进程的运行用户
worker_processes 1;  # 设置 Nginx 进程数

events {
    worker_connections 1024;  # 每个 worker 进程最大连接数
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    # 宿主机 nginx 默认用 HTTP/1.0 转发进来，不放宽到 1.0 就不会压缩
    gzip_http_version 1.0;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml;

    server {
        listen 8008;
        server_name localhost;
        root /usr/share/nginx/html;

        # 文件名带 hash 的构建产物，内容变了文件名就变，可以长期缓存
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # 入口页和 Service Worker 必须每次校验，否则发版后用户一直拿旧版本
        location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://localhost:8009;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /tele-images/ {
            proxy_pass http://localhost:8009;
            proxy_set_header Host $host;
        }
    }
}
