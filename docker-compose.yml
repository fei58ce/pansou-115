services:
  pansou:
    image: ghcr.io/fish2018/pansou:latest
    container_name: pansou
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      PORT: "8888"
      # PanSou 官方维护的 TG 频道列表（含 115 专属频道）
      CHANNELS: "tgsearchers7,Aliyun_4K_Movies,yunpanx,yp123pan,yunpanxunlei,tianyifc,peccxinpd,gotopan,PanjClub,baicaoZY,MCPH02,MCPH03,bdwpzhpd,Q66Share,ucwpzy,shareAliyun,Quark_Movies,XiangxiuNBB,ucquark,xx123pan,yingshifenxiang123,zyfb123,Lsp115,taoxgzy,Channel_Shares_115,vip115hot,wp123zy,yunpan139,yunpan189,yunpanuc,yydf_hzl,leoziyuan,yoyokuakeduanju,TG654TG,QukanMovie,yeqingjie_GJG666,movielover8888_film3,Baidu_netdisk,D_wusun,FLMdongtianfudi,KaiPanshare,rjyxfx,PikPak_Share_Channel,newproductsourcing,QuarkFree,yunpanNB,kkdj001,xxzlzn,pxyunpanxunlei,jxwpzy,kuakedongman,xiangnikanj,solidsexydoll,guoman4K,zdqxm,kduanju,cilidianying,CBduanju,SharePanFilms,dzsgx,BooksRealm,douerpan,Netdisk_Movies,yunpanquark,ciliziyuanku,jzmm_123pan,wpan8,mqte5,regengguangya,regeng115,regeng123,yy80986098,pan_guangya,guangyapan_episode,guangya_hdhive,guangyapindao,quark_res,domgmingapk,dianying4k,tgbokee,ucshare,gokuapan,WFYSFX03,gimy100,gimy115iso,fcij5,xvth5,xuexiziliaobaibaoku,phzvip,jdbigdiscount,youxigs,zhoulanziyuan,seedhub_pro,jnjy_5,xxziliao,wpzyk,ruanjianfenxiang77,jpnd5,XunLeiPinDao,a123fxme,WPpindao,kuyupan,djya5,zh_vip,gdsharing,guangyaya2026,alyp_17362,baidyunpan,yunpans,rbzhwpzy,Panzi88com"
      # 如需代理访问 Telegram，取消注释并改成你的代理
      # PROXY: "socks5://host.docker.internal:7890"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8888/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  cloudsaver:
    build:
      context: ./cloudsaver-pansou
    container_name: cloudsaver
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      JWT_SECRET: "change-me-to-a-long-random-secret"
      TELEGRAM_BASE_URL: "https://t.me/s"
      # 以下 25 个频道均已验证 t.me/s/<id> 可免登录读取
      TELE_CHANNELS: '[{"id":"tgsearchers7","name":"资源宇宙7"},{"id":"Lsp115","name":"115网盘资源分享"},{"id":"taoxgzy","name":"我的资源"},{"id":"Channel_Shares_115","name":"Shares_115_Channel"},{"id":"vip115hot","name":"懒狗集中营"},{"id":"regeng115","name":"115网盘影视热更"},{"id":"gimy115iso","name":"剧迷115影视原盘"},{"id":"yydf_hzl","name":"网盘资源合集"},{"id":"leoziyuan","name":"LEO网盘搜集"},{"id":"zyfb123","name":"112233"},{"id":"cilidianying","name":"磁力电影分享"},{"id":"ciliziyuanku","name":"磁力资源库"},{"id":"seedhub_pro","name":"SeedHub影视动漫"},{"id":"QukanMovie","name":"115影视资源分享"},{"id":"movielover8888_film3","name":"绝版风月"},{"id":"dianying4k","name":"4K影视屋"},{"id":"Netdisk_Movies","name":"海外影视资源"},{"id":"SharePanFilms","name":"网盘高分影视"},{"id":"baicaoZY","name":"百草网盘资源"},{"id":"PanjClub","name":"盘酱酱Club"},{"id":"Q66Share","name":"阿里云盘吧"},{"id":"kduanju","name":"热门短剧"},{"id":"CBduanju","name":"全网电影资源"},{"id":"yoyokuakeduanju","name":"YOYO资源"},{"id":"guoman4K","name":"国漫4K"}]'
      PANSOU_BASE_URL: "http://pansou:8888"
      # PanSou 启用类型（含 magnet 磁力搜索）
      PANSOU_CLOUD_TYPES: "baidu,aliyun,quark,115,xunlei,pikpak,123,magnet,ed2k"
      # TMDB 榜单（https://www.themoviedb.org/settings/api 申请）
      TMDB_API_KEY: ""
      TMDB_BASE_URL: "https://api.themoviedb.org/3"
      TMDB_IMAGE_BASE_URL: "https://image.tmdb.org/t/p"
      TMDB_LANGUAGE: "zh-CN"
    depends_on:
      pansou:
        condition: service_healthy
    volumes:
      - ./data/cloudsaver/config:/app/config
      - ./data/cloudsaver/data:/app/data
